version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mapple_postgres
    restart: always
    environment:
      POSTGRES_USER: mapple
      POSTGRES_PASSWORD: mapple_password_2026
      POSTGRES_DB: mapple_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapple -d mapple_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mapple_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PROJECT_NAME=Mapple API
      - API_V1_STR=/api/v1
      - DATABASE_URL=postgresql://mapple:mapple_password_2026@db:5432/mapple_db
      - SECRET_KEY=mapple_super_secret_jwt_key_production_2026_change_in_real_env!
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mapple_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
